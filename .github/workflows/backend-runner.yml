name: Backend Action Runner

on:
  schedule:
    # Run every 5 hours to ensure continuous coverage
    - cron: '0 */5 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [restart-backend]

jobs:
  run-backend:
    name: Run Backend Resizer & Tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours maximum limit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd backend
          npm install

      - name: Start Backend and Cloudflare Tunnel
        env:
          TELLER_URL: ${{ secrets.TELLER_URL || 'https://api-tiksave.mailtestvartext.workers.dev' }}
          TELLER_SECRET: ${{ secrets.TELLER_SECRET || 'tiksave-teller-secret-2026' }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd backend
          node tunnel-runner.js
